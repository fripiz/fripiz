<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test FidélityApp</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f6f6f4; color: #222; }
    main { max-width: 1040px; margin: 0 auto; }
    h1 { font-size: 1.25rem; margin: 0 0 16px; }
    .empty { color: #888; font-style: italic; text-align: center; }

    /* Tous les blocs : pas de cadre, le contenu se fond dans la page */
    .block { margin: 40px 0; }
    .block h2 { font-size: 1.35rem; text-align: center; margin: 0 0 20px; }
    .block h3.category { font-size: 1.1rem; text-align: center; margin: 28px 0 14px; }
    .block h2, .block h3, .block h4, .block p { overflow-wrap: anywhere; }

    @media (min-width: 860px) {
      h1 { font-size: 1.4rem; margin-bottom: 24px; }
      .block { margin: 56px 0; }
      .block h2 { font-size: 1.6rem; margin-bottom: 24px; }
      .block h3.category { font-size: 1.15rem; margin: 32px 0 16px; }
    }

    /* ─── Nouveautés ─────────────────────────── */

    .news-list, .agenda-list { max-width: 760px; margin: 0 auto; display: grid; gap: 28px; }
    .news-item img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; display: block; background: #e8e8e4; }
    .news-item h3 { font-size: 1.1rem; margin: 12px 0 4px; }
    .news-item p { margin: 0 0 6px; font-size: .95rem; line-height: 1.5; }
    .news-item time, .agenda-item time { color: #666; font-size: .85rem; }

    @media (min-width: 560px) {
      .news-item { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 20px; align-items: start; }
      .news-item:not(:has(img)) { grid-template-columns: minmax(0, 1fr); }
      .news-item h3 { margin-top: 0; }
    }

    /* ─── Agenda ─────────────────────────────── */

    .agenda-list { gap: 20px; }
    .agenda-item { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; align-items: start; }
    .agenda-date { text-align: center; background: #222; color: #fff; border-radius: 8px; padding: 8px 4px; line-height: 1.1; }
    .agenda-date .day { font-size: 1.4rem; font-weight: 700; display: block; }
    .agenda-date .month { font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; }
    .agenda-item h3 { font-size: 1.05rem; margin: 2px 0 4px; }
    .agenda-item p { margin: 0 0 4px; font-size: .95rem; line-height: 1.5; }

    /* ─── Boutique : carte produit ───────────── */

    .product { min-width: 0; }
    .product .img-wrap { position: relative; }
    .product img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 8px; display: block; background: #e8e8e4; }
    .product .badge { position: absolute; top: 8px; left: 8px; background: #c62828; color: #fff; font-size: .75rem; font-weight: 600; padding: 3px 7px; border-radius: 4px; }
    .product h4 { font-size: .95rem; margin: 10px 0 4px; }
    .product p { margin: 0 0 6px; font-size: .85rem; color: #555; line-height: 1.4; }
    .product .price { font-weight: 600; font-size: .95rem; }
    .product .price s { font-weight: 400; color: #888; margin-left: 6px; }

    @media (min-width: 860px) {
      .product h4 { font-size: 1.05rem; margin-top: 12px; }
      .product p { font-size: .9rem; }
      .product .price { font-size: 1rem; }
    }

    /*
      Grilles centrées : chaque colonne visible occupe 2 pistes (2 colonnes
      = 4 pistes, 3 colonnes = 6 pistes). La largeur d'une carte ne dépend
      donc que de la largeur de la grille, jamais du nombre de produits, et
      la dernière ligne incomplète est décalée d'une piste pour être centrée.
    */

    /* ─── Toute la boutique : 2 colonnes sous 860 px ─── */

    .product-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px 16px; }
    .product-grid > .product { grid-column: span 2; }
    .product-grid > .product:last-child:nth-child(2n+1) { grid-column: 2 / span 2; }

    /* ─── Nos best-sellers : carrousel sous 860 px ─── */

    .carousel-track {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .carousel-track::-webkit-scrollbar { display: none; }
    /* Une carte à la fois, avec un aperçu de la suivante */
    .carousel-track > .product { flex: 0 0 min(78%, 340px); scroll-snap-align: start; }
    .carousel.single .carousel-track { justify-content: center; }

    .carousel-nav { display: flex; justify-content: center; gap: 12px; margin-top: 16px; }
    .carousel-nav button {
      width: 44px; height: 44px; border-radius: 50%; border: 1px solid #ccc; background: #fff;
      font-size: 1.3rem; line-height: 1; cursor: pointer; color: #222;
    }
    .carousel-nav button:disabled { opacity: .35; cursor: default; }

    /* ─── À partir de 860 px : 3 colonnes, carrousel remplacé par une ligne centrée ─── */

    @media (min-width: 860px) {
      .product-grid,
      .carousel-track { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 32px 24px; overflow: visible; }
      .product-grid > .product,
      .carousel-track > .product { grid-column: span 2; }
      .product-grid > .product:last-child:nth-child(2n+1) { grid-column: span 2; }
      .product-grid > .product:last-child:nth-child(3n+1),
      .carousel-track > .product:last-child:nth-child(3n+1) { grid-column: 3 / span 2; }
      .product-grid > .product:nth-last-child(2):nth-child(3n+1),
      .carousel-track > .product:nth-last-child(2):nth-child(3n+1) { grid-column: 2 / span 2; }
      .carousel-nav { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Test FidélityApp — API publique</h1>
    <div id="blocks"></div>
  </main>

  <script>
    const DEFAULT_MERCHANT_ID = '21f5f3cc-e1ca-4176-89f7-3cc76613269e'
    const API_BASE = 'https://fidelityapp.fr/api/public/merchant'
    const BLOCKS = ['boutique', 'nouveautes', 'agenda']
    const BLOCK_LABELS = { boutique: 'Boutique', nouveautes: 'Nouveautés', agenda: 'Agenda' }
    const OTHER_CATEGORY = 'Autres'
    const MAX_BEST_SELLERS = 3

    const params = new URLSearchParams(location.search)
    const MERCHANT_ID = params.get('merchant') || DEFAULT_MERCHANT_ID

    function esc(value) {
      const div = document.createElement('div')
      div.textContent = value == null ? '' : String(value)
      return div.innerHTML
    }

    function toDate(value) {
      if (!value) return null
      // Une date seule (AAAA-MM-JJ) est interprétée en heure locale, pas en UTC
      const d = /^\d{4}-\d{2}-\d{2}$/.test(value) ? new Date(value + 'T00:00:00') : new Date(value)
      return isNaN(d) ? null : d
    }

    function formatDate(value) {
      const d = toDate(value)
      return d ? d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) : ''
    }

    const euro = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' })

    // ─── Nouveautés ──────────────────────────────

    function renderNews(items) {
      if (!items.length) return '<p class="empty">Aucune nouveauté.</p>'
      return `<div class="news-list">${items.map(item => `
        <article class="news-item">
          ${item.imageUrl ? `<img src="${esc(item.imageUrl)}" alt="" loading="lazy">` : ''}
          <div>
            <h3>${esc(item.title)}</h3>
            ${item.content ? `<p>${esc(item.content)}</p>` : ''}
            ${item.publishedAt ? `<time datetime="${esc(item.publishedAt)}">${esc(formatDate(item.publishedAt))}</time>` : ''}
          </div>
        </article>`).join('')}</div>`
    }

    // ─── Agenda ──────────────────────────────────

    function renderAgenda(items) {
      if (!items.length) return '<p class="empty">Aucun événement à venir.</p>'
      return `<div class="agenda-list">${items.map(item => {
        const d = toDate(item.eventDate)
        return `
          <article class="agenda-item">
            <div class="agenda-date" aria-hidden="true">
              ${d ? `<span class="day">${d.getDate()}</span>
              <span class="month">${esc(d.toLocaleDateString('fr-FR', { month: 'short' }))}</span>` : '?'}
            </div>
            <div>
              <h3>${esc(item.title)}</h3>
              ${item.description ? `<p>${esc(item.description)}</p>` : ''}
              ${item.eventDate ? `<time datetime="${esc(item.eventDate)}">${esc(formatDate(item.eventDate))}</time>` : ''}
            </div>
          </article>`
      }).join('')}</div>`
    }

    // ─── Boutique ────────────────────────────────

    // La promo n'est plus affichée une fois promoEndDate dépassée
    function isPromoActive(p) {
      if (p.originalPrice == null) return false
      if (!p.promoEndDate) return true
      return p.promoEndDate >= new Date().toISOString().slice(0, 10)
    }

    function renderProduct(p) {
      const promo = isPromoActive(p)
      return `
        <article class="product">
          <div class="img-wrap">
            ${p.imageUrl ? `<img src="${esc(p.imageUrl)}" alt="${esc(p.name)}" loading="lazy">` : '<img alt="">'}
            ${promo && p.promoLabel ? `<span class="badge">${esc(p.promoLabel)}</span>` : ''}
          </div>
          <h4>${esc(p.name)}</h4>
          ${p.description ? `<p>${esc(p.description)}</p>` : ''}
          ${p.price != null ? `
            <div class="price">
              ${esc(euro.format(p.price))}
              ${promo ? `<s>${esc(euro.format(p.originalPrice))}</s>` : ''}
            </div>` : ''}
        </article>`
    }

    function renderGrid(products) {
      return `<div class="product-grid">${products.map(renderProduct).join('')}</div>`
    }

    function renderCarousel(products) {
      const single = products.length === 1
      return `
        <div class="carousel${single ? ' single' : ''}" data-carousel>
          <div class="carousel-track">${products.map(renderProduct).join('')}</div>
          ${single ? '' : `
            <div class="carousel-nav">
              <button type="button" data-dir="-1" aria-label="Produit précédent">‹</button>
              <button type="button" data-dir="1" aria-label="Produit suivant">›</button>
            </div>`}
        </div>`
    }

    // Groupes dans l'ordre d'apparition (l'API trie par position), "Autres" en dernier
    function groupByCategory(products) {
      const groups = new Map()
      for (const p of products) {
        const key = p.category || OTHER_CATEGORY
        if (!groups.has(key)) groups.set(key, [])
        groups.get(key).push(p)
      }
      if (groups.has(OTHER_CATEGORY)) {
        const others = groups.get(OTHER_CATEGORY)
        groups.delete(OTHER_CATEGORY)
        groups.set(OTHER_CATEGORY, others)
      }
      return groups
    }

    function renderBoutique(products) {
      // L'API renvoie les produits triés par position : les 3 premiers featured
      const featured = products.filter(p => p.featured === true).slice(0, MAX_BEST_SELLERS)
      const groups = groupByCategory(products)
      return `
        ${featured.length ? `
          <section class="block">
            <h2>Nos best-sellers</h2>
            ${renderCarousel(featured)}
          </section>` : ''}
        <section class="block">
          <h2>Toute la boutique</h2>
          ${products.length
            ? [...groups].map(([category, items]) => `
                <h3 class="category">${esc(category)}</h3>
                ${renderGrid(items)}`).join('')
            : '<p class="empty">Aucun produit.</p>'}
        </section>`
    }

    // Flèches : défilent d'une carte, désactivées aux extrémités
    function setupCarousel(root) {
      const track = root.querySelector('.carousel-track')
      const prev = root.querySelector('[data-dir="-1"]')
      const next = root.querySelector('[data-dir="1"]')
      if (!prev || !next) return

      const update = () => {
        const max = track.scrollWidth - track.clientWidth
        prev.disabled = track.scrollLeft <= 1
        next.disabled = track.scrollLeft >= max - 1
      }

      const step = () => {
        const card = track.querySelector('.product')
        const gap = parseFloat(getComputedStyle(track).columnGap) || 0
        return card ? card.getBoundingClientRect().width + gap : track.clientWidth
      }

      prev.addEventListener('click', () => track.scrollBy({ left: -step() }))
      next.addEventListener('click', () => track.scrollBy({ left: step() }))
      track.addEventListener('scroll', update, { passive: true })
      window.addEventListener('resize', update)
      update()
    }

    // ─── Chargement ──────────────────────────────

    async function fetchBlock(blockType) {
      const url = `${API_BASE}/${encodeURIComponent(MERCHANT_ID)}/blocks/${blockType}`
      const res = await fetch(url)
      if (!res.ok) throw new Error(`HTTP ${res.status} sur ${url}`)
      const data = await res.json()
      return Array.isArray(data.items) ? data.items : []
    }

    function renderBlock(blockType, result) {
      const wrapper = document.createElement('div')
      const label = BLOCK_LABELS[blockType] || blockType
      if (result.status === 'rejected') {
        // Détail de l'erreur en console uniquement, rien de technique à l'écran
        console.error(`[FidélityApp] bloc ${blockType} :`, result.reason)
        wrapper.innerHTML = `<p class="empty">${esc(label)} : contenu indisponible.</p>`
        return wrapper
      }
      const items = result.value
      if (blockType === 'boutique') {
        wrapper.innerHTML = renderBoutique(items)
      } else {
        const body = blockType === 'nouveautes' ? renderNews(items) : renderAgenda(items)
        wrapper.innerHTML = `<section class="block"><h2>${esc(label)}</h2>${body}</section>`
      }
      return wrapper
    }

    async function init() {
      const container = document.getElementById('blocks')
      container.innerHTML = '<p class="empty">Chargement…</p>'
      const results = await Promise.allSettled(BLOCKS.map(fetchBlock))
      container.innerHTML = ''
      results.forEach((r, i) => container.appendChild(renderBlock(BLOCKS[i], r)))
      // Après insertion dans le DOM, sinon scrollWidth vaut 0
      container.querySelectorAll('[data-carousel]').forEach(setupCarousel)
    }

    init()
  </script>
</body>
</html>
